name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test DigitalBrain.slnx -c Release --no-build --no-restore --verbosity minimal

  flutter-web-build:
    name: Flutter web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/Modules/UI/Flutter/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/UI/Flutter
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/UI/Flutter
        run: dart format --output=none --set-exit-if-changed core kit shell

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub
