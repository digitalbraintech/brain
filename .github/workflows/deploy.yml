name: deploy

# Release-gated Flutter web deployment and kernel image publication.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish-kernel-image:
    name: Publish kernel image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kernel image
        env:
          ContainerImageTags: ${{ github.event.release.tag_name }};latest
        run: |
          dotnet publish src/Kernel/DigitalBrain.Silo/DigitalBrain.Silo.csproj \
            -c Release -r linux-x64 /t:PublishContainer \
            -p:PublishProfile=Container \
            -p:EnableSdkContainerSupport=true \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel

      # MCP image publication remains intentionally commented out for now.
      #
      # - name: Publish MCP image
      #   env:
      #     ContainerImageTags: ${{ github.event.release.tag_name }};latest
      #   run: |
      #     dotnet publish src/Kernel/DigitalBrain.Mcp/DigitalBrain.Mcp.csproj \
      #       -c Release -r linux-x64 /t:PublishContainer \
      #       -p:PublishProfile=Container \
      #       -p:EnableSdkContainerSupport=true \
      #       -p:ContainerRegistry=docker.io \
      #       -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-mcp

  update-kernel-container-app:
    name: Roll kernel container app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-kernel-image
    environment:
      name: production
    permissions:
      contents: read
      # OIDC exchange against the user-assigned managed identity in intochat-rg.
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the kernel to the release image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "docker.io/${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel:${{ github.event.release.tag_name }}"

      - name: Wait for the new revision to take traffic
        # The old revision keeps serving the public FQDN until the new one is
        # ready, so polling /health alone goes green against the code we are
        # replacing. Gate on the new revision by name first.
        run: |
          revision=$(az containerapp revision list \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?contains(properties.template.containers[0].image, ':${{ github.event.release.tag_name }}')] | [-1].name" \
            --output tsv)
          if [ -z "$revision" ]; then
            echo "no revision found running ${{ github.event.release.tag_name }}"
            exit 1
          fi
          echo "waiting on revision ${revision}"

          for attempt in $(seq 1 40); do
            state=$(az containerapp revision show \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --revision "$revision" \
              --query properties.runningState --output tsv || true)
            case "$state" in
              Running|RunningAtMaxScale)
                echo "revision ${revision} is ${state}"
                status=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.KERNEL_PUBLIC_URL }}/health" || true)
                if [ "$status" = "200" ]; then
                  echo "kernel healthy on the new revision"
                  exit 0
                fi
                echo "revision up but /health returned ${status}"
                ;;
              Failed|Degraded)
                echo "revision ${revision} reported ${state}"
                az containerapp logs show \
                  --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
                  --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                  --revision "$revision" --type system --tail 40
                exit 1
                ;;
              *)
                echo "attempt ${attempt}: revision ${state:-unknown}"
                ;;
            esac
            sleep 15
          done
          echo "revision ${revision} did not take traffic within 10 minutes"
          exit 1

  deploy-flutter-web:
    name: Deploy Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://purple-sky-0f80f110f.7.azurestaticapps.net/
    defaults:
      run:
        working-directory: src/Modules/UI/Flutter/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/UI/Flutter
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/UI/Flutter
        run: dart format --output=none --set-exit-if-changed core kit shell

      - name: Core package tests
        working-directory: src/Modules/UI/Flutter/core
        run: |
          if [ -d test ]; then dart test; else echo "no core tests"; fi

      - name: Kit package tests
        working-directory: src/Modules/UI/Flutter/kit
        run: |
          if [ -d test ]; then flutter test --no-pub; else echo "no kit tests"; fi

      - name: Shell tests
        run: flutter test --no-pub
      - name: Web release build
        # Without the define the shell falls back to its own SWA origin, which
        # serves no kernel. vars.KERNEL_PUBLIC_URL is the Container App FQDN.
        run: |
          flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub \
            --dart-define=DIGITALBRAIN_UI_BASE=${{ vars.KERNEL_PUBLIC_URL }}

      - name: Deploy Flutter web
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/Modules/UI/Flutter/shell/build/web
          api_location: ''
          output_location: ''
          skip_app_build: true
