# Local smoke for product images. Not a production topology.
#
# Platform dependencies are external to product Hub images:
#   - Qdrant: start separately or uncomment the service below (not a product image)
#   - Ollama / Azure OpenAI: point DigitalBrain__AI__* at your endpoint
#   - Azure Storage: Azurite below is for smoke only
#
# Build:
#   docker compose build
#
# Secrets: never commit real values. Prefer env file or Key Vault-injected env
# (see headers in src/Kernel/DigitalBrain.Silo/Dockerfile).
# Kernel HTTP serves chat streams + OAuth on 8080 (map host 5080 for stable OAuth if needed).

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  # External platform dependency — not the digitalbrain product image.
  # Uncomment for an in-compose Qdrant; otherwise set ConnectionStrings__memory-qdrant
  # to a host/remote instance (e.g. http://host.docker.internal:6334).
  # qdrant:
  #   image: qdrant/qdrant:v1.18.0
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"

  digitalbrain:
    image: vhorbachov/digitalbrain-kernel:local
    build:
      context: .
      dockerfile: src/Kernel/DigitalBrain.Silo/Dockerfile
    ports:
      - "8080:8080"
      - "5080:8080"
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # --- Key Vault / secret injection surface (empty here on purpose) ---
      # DigitalBrain__Google__Gmail__OAuth__ClientId:
      # DigitalBrain__Google__Gmail__OAuth__ClientSecret:
      # DigitalBrain__Google__Gmail__OAuth__PublicOrigin: http://localhost:5080
      # DigitalBrain__Salesforce__Mcp__Endpoint: https://api.salesforce.com/platform/mcp/v1/platform/sobject-all
      # DigitalBrain__Salesforce__OAuth__ConsumerKey:
      # DigitalBrain__Salesforce__OAuth__ConsumerSecret:
      # DigitalBrain__Salesforce__OAuth__PublicOrigin: http://localhost:5080
      # DigitalBrain__AI__Ollama__Endpoint: http://host.docker.internal:11434
      # DigitalBrain__AI__OpenAI__ApiKey:
      # DigitalBrain__AI__OpenAI__Endpoint:
      ConnectionStrings__clustering: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ConnectionStrings__reminders: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ConnectionStrings__journal: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      ConnectionStrings__grainstate: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      DigitalBrain__Memory__Provider: Qdrant
      DigitalBrain__Memory__Qdrant__ConnectionName: memory-qdrant
      # Point at external Qdrant (host or uncommented qdrant service):
      ConnectionStrings__memory-qdrant: "Endpoint=http://host.docker.internal:6334"
    depends_on:
      - azurite
    extra_hosts:
      - "host.docker.internal:host-gateway"
