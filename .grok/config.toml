[mcp_servers.aspire]
command = "aspire"
args = [
    "agent",
    "mcp",
]
startup_timeout_sec = 20

[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]
startup_timeout_sec = 20

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
startup_timeout_sec = 15

[mcp_servers.context7]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@upstash/context7-mcp@latest",
]
startup_timeout_sec = 45

[mcp_servers.codegraph]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@colbymchenry/codegraph@latest",
    "serve",
    "--mcp",
]
startup_timeout_sec = 45

[mcp_servers.digitalbrain-mcp]
url = "http://localhost:5080/mcp"
startup_timeout_sec = 15

[mcp_servers.digitalbrain]
url = "http://localhost:5080/mcp?principal=grok"
enabled = true

[plugins]
enabled = [
    "superpowers",
    "mattpocock-skills",
    "double-shot-latte",
    "frontend-design",
    "code-review",
    "feature-dev",
    "code-simplifier",
    "ralph-loop",
    "claude-md-management",
    "pr-review-toolkit",
    "commit-commands",
    "hookify",
    "security-guidance",
]
