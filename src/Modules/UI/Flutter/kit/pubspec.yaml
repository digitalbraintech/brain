name: digitalbrain_ui_kit
description: >
  Shared UI kit for DigitalBrain Flutter host. One widget family per component
  (button, chart, card, …), usable in surfaces and inside flutter_chat_ui
  CustomMessage bubbles.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  digitalbrain_flutter:
    path: ../core
  forui: ^0.26.0
  material_ui: ^1.1.1
  gpt_markdown: ^1.2.1
  flutter_svg: ^2.3.0
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  graphic: ^2.7.0
  three_js: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/aspire-icon-32.svg
